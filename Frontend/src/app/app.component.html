<header>
  <div class="header">
    <img class="logo" src="./assets/icon-200h.png" alt="logo">
    <h1>{{ title() | titlecase }}</h1>
  </div>
  <app-button [button]="button()" />
</header>
<body>

<div class="container">
  @for (project of projectList() ; track project.id) {
    <mat-card class="card" appearance="outlined">
      <mat-card-header>
        <mat-card-title>{{ project.label }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <!--add content-->
      </mat-card-content>
      <mat-card-footer class="card-footer">
        <app-chips [chips]="project.status"></app-chips>
      </mat-card-footer>
    </mat-card>
  }
</div>


<router-outlet />
</body>
