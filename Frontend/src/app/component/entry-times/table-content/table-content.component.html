<div class="board">
  <table mat-table [dataSource]="timeEntryService.entries()" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Id </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>
    <ng-container matColumnDef="workDate">
      <th mat-header-cell *matHeaderCellDef> work date </th>
      <td mat-cell *matCellDef="let element"> {{element.workDate | date: 'dd MMM'}} </td>
    </ng-container>
    <ng-container matColumnDef="product">
      <th mat-header-cell *matHeaderCellDef> Product </th>
      <td mat-cell *matCellDef="let element">{{element.product?.label}}</td>
    </ng-container>
    <ng-container matColumnDef="module">
      <th mat-header-cell *matHeaderCellDef> Module </th>
      <td mat-cell *matCellDef="let element"> {{element.module?.label}} </td>
    </ng-container>
    <ng-container matColumnDef="activity">
      <th mat-header-cell *matHeaderCellDef> Activity </th>
      <td mat-cell *matCellDef="let element"> {{element.activity?.label}} </td>
    </ng-container>
    <ng-container matColumnDef="workload">
      <th mat-header-cell *matHeaderCellDef> Workload </th>
      <td mat-cell *matCellDef="let element"> {{element.workload}} </td>
    </ng-container>
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef> Delete </th>
      <td mat-cell *matCellDef="let element"
          (click)="delete(element)"
      > <mat-icon>delete</mat-icon>
      </td>
    </ng-container>
    <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef> Edit </th>
      <td mat-cell *matCellDef="let element"
          (click)="openDialog(element)"
      > <mat-icon>edit</mat-icon>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" ></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        (click)="update(row)"></tr>
  </table>
</div>
