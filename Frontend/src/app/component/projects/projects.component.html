<div class="container">
  <div class="container-header">
    <h2>Mes projets</h2>
    <p>{{projectList().length }} projets </p>

    <div class="container-header-search">
      <div class="container-header-search-chips">
        @for (status of status(); track status){
          <app-chips class="chip-list" [label]="status" [isButton]="true"></app-chips>
        }

      </div>
      <div class="d-flex">
        <input type="text" class="mr-5">
        <app-button [button]="button()" />
      </div>


    </div>


  </div>

  <div class="container-body">
    @for (project of projectList() ; track project.id) {
      <mat-card class="card" appearance="outlined">
        <mat-card-header class="card-header">
          <!--project type-->
          <mat-card-title>
            @for (p of project.projectTypes; track p.id){
              {{ p.label }}
            }

          </mat-card-title>
          <mat-card-subtitle>{{ project.label }}</mat-card-subtitle>
          <a [routerLink]="['/projectDetail', project.id]"><mat-icon>more_vert</mat-icon></a>

        </mat-card-header>
        <mat-card-content>
          <!--add content-->
        </mat-card-content>
        <mat-card-footer class="card-footer">
          <app-chips [label]="project.status" [color]="statusColors[project.status]"></app-chips>
        </mat-card-footer>
      </mat-card>
    }
    @empty {
      <p>Il n'y a pas encore de projet ici</p>
    }
  </div>
</div>
