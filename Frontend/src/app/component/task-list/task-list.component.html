  <tbody>
    @for (task of tasks(); track task.id){
      <tr>
       <th>{{task.id}}




       </th>


        <th>
          <form class="todo" (ngSubmit)="onSubmitForm()">
            <input name="todo"
                 [(ngModel)]="task.title"
                 type="text" placeholder="todo" required>
            <button><i class="fa-solid fa-pen"></i></button>
          </form>

        </th>

        <td></td>
        <td>
          <button (click)="updateCompleted(task)">
            @if (task.isCompleted){
              <i class="fa-solid fa-check"></i>
            } @else {
              <i class="fa-solid fa-arrows-rotate"></i>
            }
          </button>
        </td>

        <td><button (click)="deleteTask(task.id!)"><i class="fa-solid fa-trash"></i></button></td>
      </tr>
    }@empty {
      <p>pas de tâche</p>
    }
  </tbody>
</table>
