  <tbody>
    @for (task of tasks(); track task.id){
      <tr>
       <th>{{task.id}}</th>
        <th>{{task.title | titlecase}}</th>
        <td>
          <button (click)="updateCompleted(task)">
            @if (task.isCompleted){
              <i class="fa-solid fa-check"></i>
            } @else {
              <i class="fa-solid fa-arrows-rotate"></i>
            }
          </button>
        </td>
        <td><button (click)="updateTaskTitle(task)"><i class="fa-solid fa-pen"></i></button></td>
        <td><button (click)="deleteTask(task.id!)"><i class="fa-solid fa-trash"></i></button></td>
      </tr>
    }@empty {
      <p>pas de tâche</p>
    }
  </tbody>
</table>
